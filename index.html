<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 대학 룰렛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a;
            user-select: none; -webkit-user-select: none; margin: 0; padding: 0; overflow-x: hidden;
        }
        .wheel-container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1/1; margin: 0 auto; touch-action: none; cursor: grab; }
        .wheel-container:active { cursor: grabbing; }
        canvas#rouletteCanvas { width: 100%; height: 100%; border-radius: 50%; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); display: block; }
        .pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 26px; height: 40px; background-color: #0f172a; clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 10; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2)); }
        .center-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; background-color: #ffffff; border: 5px solid #0f172a; border-radius: 50%; z-index: 5; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.12); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .btn-spin:active { transform: scale(0.97); }

        .pop-in { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
        #confettiCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
        .toggle-checkbox:checked { right: 0; border-color: #0f172a; }
        .toggle-checkbox:checked + .toggle-label { background-color: #0f172a; }

        .shake-screen { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }
        .shake-screen-heavy { animation: shakeHeavy 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 2px, 0); } 20%, 80% { transform: translate3d(4px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 4px, 0); } 40%, 60% { transform: translate3d(5px, -4px, 0); }
        }
        @keyframes shakeHeavy {
            10%, 90% { transform: translate3d(-10px, 6px, 0); } 20%, 80% { transform: translate3d(12px, -8px, 0); }
            30%, 50%, 70% { transform: translate3d(-14px, 10px, 0); } 40%, 60% { transform: translate3d(14px, -10px, 0); }
        }

        .hp-layer-bg { background-color: #1e293b; }
        .hp-layer-trail { transition: width 0.7s ease-out; }
        .hp-layer-main { transition: width 0.1s ease-out; }
        .battlefield-grid {
            position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.8;
            background-image:
                linear-gradient(rgba(125, 211, 252, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.15) 1px, transparent 1px),
                linear-gradient(rgba(125, 211, 252, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.3) 1px, transparent 1px);
            background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
        }
        .battlefield-grid::before, .battlefield-grid::after {
            content: ''; position: absolute; background: rgba(186, 230, 253, 0.42);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.24);
        }
        .battlefield-grid::before { width: 1px; height: 100%; left: 50%; }
        .battlefield-grid::after { width: 100%; height: 1px; top: 50%; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 relative">

    <canvas id="confettiCanvas"></canvas>

    <header class="sticky top-0 w-full h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-30 shrink-0 shadow-sm">
        <button id="menuBtn" class="p-2 -ml-2 rounded-lg hover:bg-slate-100 text-slate-700 transition-colors focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <span class="text-xs font-bold text-slate-600 hidden sm:inline">설정 / 대학 목록</span>
        </button>
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900">대학 룰렛</h1>
        </div>
        <div class="w-10"></div>
    </header>

    <main id="mainRouletteView" class="flex-1 flex flex-col items-center justify-center p-4 relative z-0 my-auto">
        <div class="w-full max-w-lg mx-auto flex flex-col items-center py-2">
            <div id="battleStatusBanner" class="hidden w-full max-w-md bg-slate-900 text-white p-3 rounded-2xl mb-4 shadow-lg flex items-center justify-between px-5 transition-all">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-blue-400 animate-ping"></span>
                    <span id="battleStatusText" class="text-sm font-bold">1차 선발: 블루 코너 추첨 중...</span>
                </div>
                <span class="text-xs font-semibold bg-slate-800 px-2.5 py-1 rounded-lg text-slate-300">격투 준비</span>
            </div>
            
            <div class="wheel-container mb-6 mt-2" id="wheelContainer">
                <div class="pointer"></div>
                <div class="center-pin"></div>
                <canvas id="rouletteCanvas"></canvas>
            </div>
            
            <button id="spinBtn" class="btn-spin w-full max-w-md py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-bold text-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-xl shadow-slate-900/10">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                <span id="spinBtnText">추첨 시작!</span>
            </button>
        </div>
    </main>

    <div id="battleArenaView" class="fixed inset-0 bg-slate-950 z-40 hidden flex flex-col justify-between p-2 md:p-4 overflow-hidden">
        <div class="w-full max-w-5xl mx-auto bg-slate-900/90 backdrop-blur-md p-3 md:p-5 rounded-2xl border border-slate-800 shadow-2xl flex flex-col gap-3 z-10">
            <div class="flex items-center justify-between text-white font-black text-base md:text-2xl px-1">
                <div class="flex items-center gap-2 text-blue-400 w-[40%]">
                    <span id="blueTeamName" class="truncate drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">블루 대학</span>
                </div>
                <div class="text-red-500 font-black tracking-[0.2em] italic text-xl md:text-2xl drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">VS</div>
                <div class="flex items-center gap-2 text-red-400 w-[40%] justify-end">
                    <span id="redTeamName" class="truncate text-right drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]">레드 대학</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 md:gap-6 items-center">

                    <div id="blueHpTrail" class="hp-layer-trail absolute left-0 top-0 h-full bg-white w-full opacity-70"></div>
                    <div id="blueHpMain" class="hp-layer-main absolute left-0 top-0 h-full bg-gradient-to-r from-blue-700 to-cyan-400 w-full border-r-2 border-white/50"></div>
                </div>
                <div class="w-full h-6 md:h-8 hp-layer-bg rounded-l-lg border-y-2 border-l-2 border-slate-700 relative overflow-hidden transform skew-x-[10deg]">
                    <div id="redHpTrail" class="hp-layer-trail absolute right-0 top-0 h-full bg-white w-full opacity-70"></div>
                    <div id="redHpMain" class="hp-layer-main absolute right-0 top-0 h-full bg-gradient-to-l from-red-700 to-amber-500 w-full border-l-2 border-white/50"></div>
                </div>
            </div>
            <div class="flex justify-between text-[10px] md:text-xs text-slate-300 font-bold px-1 tracking-wide">

                <span id="redSkillText" class="text-right"></span>

        </div>

        <div class="flex-1 my-2 md:my-3 relative w-full max-w-5xl mx-auto rounded-xl overflow-hidden border-2 border-slate-800 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-700 via-slate-900 to-black shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] flex items-center justify-center">
            <div class="battlefield-grid"></div>
            <canvas id="battleCanvas" class="w-full h-full block relative z-10"></canvas>
            
            <div id="battleResultOverlay" class="absolute inset-0 bg-black/80 hidden flex-col items-center justify-center backdrop-blur-sm z-30">
                <h3 class="text-5xl md:text-7xl text-amber-400 font-black mb-4 tracking-widest italic drop-shadow-[0_0_20px_rgba(245,158,11,0.9)]">K.O!</h3>
                <h2 id="battleWinnerText" class="text-4xl md:text-6xl font-extrabold text-white drop-shadow-[0_0_20px_rgba(255,255,255,1)] mb-10 text-center px-4"></h2>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <button id="rematchBattleBtn" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-lg transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)]">
                        🔄 재경기 (스킬 유지)
                    </button>
                    <button id="returnFromBattleBtn" class="px-8 py-4 bg-slate-100 hover:bg-white text-slate-900 rounded-xl font-bold text-lg transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                        격투 종료 및 복귀
                    </button>
                </div>
            </div>
        </div>

        <div class="w-full max-w-5xl mx-auto flex justify-between items-center px-2 py-1 z-10">
            <div class="flex gap-2">
                <button id="pauseBattleBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs transition-colors border border-slate-700">
                    ⏸ 일시정지
                </button>
                <button id="speedBattleBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs transition-colors border border-slate-700 w-[68px]">
                    ⚡ 1.0x
                </button>
            </div>
            <button id="exitBattleEarlyBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold text-xs transition-colors border border-slate-700">
                전투 강제 종료
            </button>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>

    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-[320px] max-w-[85vw] bg-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl border-r border-slate-200">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white">
            <div>
                <h2 class="text-lg font-bold text-slate-900">설정 / 대학 목록</h2>
                <p class="text-xs font-semibold text-slate-500 mt-0.5" id="countDisplay">총 0개 선택됨</p>
            </div>
            <button id="closeSidebarBtn" class="p-2 -mr-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors focus:outline-none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <div class="p-4 border-b border-slate-100 bg-gradient-to-r from-red-50 to-amber-50 shrink-0">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-sm font-bold text-slate-900 flex items-center gap-1.5">⚔️ 격투 모드</span>
                    <p class="text-[10px] text-slate-500 mt-0.5 leading-tight">2번 추첨 후 AI 2D 격투 시뮬레이션 진행</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="battleToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500 shadow-inner"></div>
                </label>
            </div>
        </div>

        <div class="p-4 border-b border-slate-100 bg-gradient-to-r from-indigo-50 to-sky-50 shrink-0">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-sm font-bold text-slate-900 flex items-center gap-1.5">⚙️ 동적 카메라</span>
                    <p class="text-[10px] text-slate-500 mt-0.5 leading-tight">전투 중 카메라가 두 전투원을 부드럽게 추적</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="dynamicCameraToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500 shadow-inner"></div>
                </label>
            </div>
        </div>

        <div class="p-3 border-b border-slate-100 bg-slate-50 shrink-0">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="대학 이름 검색..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition-shadow">
            </div>
        </div>

        <div class="px-3 py-2 flex gap-2 border-b border-slate-100 shrink-0 bg-white">
            <button id="selectAllBtn" class="flex-1 text-xs font-semibold py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">전체 선택</button>
            <button id="deselectAllBtn" class="flex-1 text-xs font-semibold py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">전체 해제</button>
            <button id="shuffleBtn" class="text-xs font-semibold px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg transition-colors">순서 섞기</button>
        </div>
        <div id="universityList" class="flex-1 overflow-y-auto p-3 custom-scrollbar flex flex-col gap-1.5 bg-slate-50"></div>
    </aside>

    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modalContent" class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl relative z-10 border border-slate-100 hidden">
            <p id="modalSubTitle" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">당첨 결과</p>
            <h2 id="winnerName" class="text-2xl font-extrabold text-slate-900 tracking-tight leading-tight my-5"></h2>
            <button id="closeModalBtn" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-base transition-colors shadow-md">확인</button>
        </div>
    </div>

    <script>
        const rawUniversities = [
            '서울대학교', '연세대학교', '고려대학교', '서강대학교', '성균관대학교', '한양대학교', 
            '중앙대학교', '경희대학교', '한국외국어대학교', '서울시립대학교', '이화여자대학교', '건국대학교', 
            '동국대학교', '홍익대학교', '국민대학교', '숭실대학교', '세종대학교', '단국대학교', 
            '광운대학교', '명지대학교', '상명대학교', '가톨릭대학교', '숙명여자대학교', '성신여자대학교', 
            '동덕여자대학교', '덕성여자대학교', '서울여자대학교', '한성대학교', '서경대학교', '삼육대학교',
            'KAIST', 'POSTECH', 'UNIST', 'DGIST', 'GIST', '한국에너지공과대학교',
            '인하대학교', '아주대학교', '가천대학교', '경기대학교', '인천대학교', '한국항공대학교', 
            '강남대학교', '수원대학교', '안양대학교', '차의과학대학교', '한세대학교', '성결대학교',
            '협성대학교', '평택대학교', '한양대(ERICA)', '충남대학교', '충북대학교', '공주대학교', 
            '순천향대학교', '한국기술교육대학교', '한밭대학교', '목원대학교', '배재대학교', '우송대학교', 
            '대전대학교', '청주대학교', '선문대학교', '호서대학교', '남서울대학교', '부산대학교', 
            '경북대학교', '부경대학교', '동아대학교', '울산대학교', '영남대학교', '계명대학교', 
            '대구대학교', '창원대학교', '동의대학교', '경성대학교', '인제대학교', '대구가톨릭대학교', 
            '금오공과대학교', '한동대학교', '경남대학교', '동서대학교', '신라대학교', '경상국립대학교',
            '전남대학교', '전북대학교', '조선대학교', '원광대학교', '목포대학교', '군산대학교', 
            '순천대학교', '우석대학교', '호남대학교', '광주대학교', '강원대학교', '제주대학교', 
            '연세대(미래)', '한림대학교', '상지대학교', '가톨릭관동대학교', '한라대학교'
        ];

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let universities = rawUniversities.map((name, index) => ({ id: index, name: name, active: true }));
        const colors = ['#f8fafc', '#f1f5f9', '#e2e8f0']; 

        let isBattleMode = false;
        let isDynamicCamera = false;
        
        function loadData() {
            try {
                const savedData = localStorage.getItem('univ_roulette_data');
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    universities.forEach(u => {
                        const savedItem = parsed.find(p => p.name === u.name);
                        if (savedItem !== undefined) u.active = savedItem.active;
                    });
                }
                const savedBattle = localStorage.getItem('univ_roulette_battle');
                if (savedBattle !== null) {
                    isBattleMode = savedBattle === 'true';
                }

        function resizeCanvas() {
            const size = canvas.parentElement.clientWidth;
            if (!size) return; // 컨테이너가 숨겨진 상태(0px)일 때는 스킵하여 잘못된 렌더링 방지
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr; canvas.height = size * dpr;
            // scale()은 누적되므로 setTransform으로 항상 절대 배율을 지정해 반복 호출에도 안전하게 함
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        function drawWheel(angleOffset = currentAngle) {
            const activeItems = universities.filter(u => u.active);
            const size = canvas.clientWidth, cx = size / 2, cy = size / 2, radius = size / 2;
            ctx.clearRect(0, 0, size, size);

            if (activeItems.length === 0) {
                ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#e2e8f0"; ctx.fill();
                ctx.fillStyle = "#64748b"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.font = "bold 18px Pretendard"; ctx.fillText("선택된 대학이 없습니다", cx, cy);
                return;
            }

            const sliceAngle = (2 * Math.PI) / activeItems.length;
            for (let i = 0; i < activeItems.length; i++) {
                const startAngle = angleOffset + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length]; ctx.fill();
                ctx.lineWidth = 1; ctx.strokeStyle = "#ffffff"; ctx.stroke();
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right"; ctx.textBaseline = "middle";
                let fontSize = Math.max(8, Math.min(20, (2 * Math.PI * radius / activeItems.length) * 0.6));
                ctx.font = `bold ${fontSize}px Pretendard`;
                ctx.fillStyle = (i % 2 === 0) ? "#0f172a" : "#475569";
                ctx.fillText(activeItems[i].name, radius * 0.94, 0, radius * 0.45);
                ctx.restore();
            }
        }

        function shootProjectile(caster, target, type, angleOffset=0) {
            const dx = target.x - caster.x, dy = target.y - caster.y;
            // 타겟과 동일한 위치일 때 각도 NaN 방어
            let angle = (dx === 0 && dy === 0) ? 0 : Math.atan2(dy, dx) + angleOffset;
            let speed = 15, radius = 8, dmg = 50, life = 100, penetrate = false, homing = false;
            let c = caster.colorLight;

            if(type === 'laser') { speed = 35; radius = 5; dmg = 80; }
            if(type === 'bullet') { speed = 22; radius = 4; dmg = 35; }
            if(type === 'meteor') { speed = 8; radius = 25; dmg = 350; c = caster.color; }
            if(type === 'tornado') { speed = 5; radius = 30; dmg = 8; penetrate = true; life = 200; homing = true; }
            if(type === 'homing') { speed = 12; radius = 6; dmg = 70; homing = true; }

        function applyDamage(defender, attacker, dmg) {

            if (defender.shield > 0) { const b = Math.min(defender.shield, dmg); dmg -= b; defender.shield -= b; }
            if (defender.reflect > 0) { // 반사: 다음 피해를 공격자에게 되돌림
                defender.reflect = 0;
                attacker.hp -= dmg;
                createDamageText(attacker.x, attacker.y, `반사! -${dmg}`, defender.colorLight, 18);
                return;
            }
            defender.hp -= dmg;
        }

        function applySkill(caster, target) {
            if (caster.frozen > 0 || caster.z > 0) return; 
            if (caster.cooldown > 0) caster.cooldown--;
            
            if (caster.cooldown <= 0 && Math.random() < 0.035) {
                caster.cooldown = Math.floor(Math.random() * 50 + 40); 
                const skill = caster.skills[Math.floor(Math.random() * 3)];
                const c = caster.colorLight;
                const baseC = caster.color;

                const dist = Math.hypot(target.x - caster.x, target.y - caster.y) || 0.1; // NaN 보정

                switch(skill.id) {
                    case 'dash':
                        let angD = Math.atan2(target.y - caster.y, target.x - caster.x);
                        caster.vx = Math.cos(angD) * 40; caster.vy = Math.sin(angD) * 40;
                        createParticles(caster.x, caster.y, c, 15);
                        break;
                    case 'laser': shootProjectile(caster, target, 'laser'); break;
                    case 'shield': caster.shield = 400; createParticles(caster.x, caster.y, c, 20); break;
                    case 'meteor': shootProjectile(caster, target, 'meteor'); break;
                    case 'blackhole':
                        target.vx += (caster.x - target.x) * 0.15; target.vy += (caster.y - target.y) * 0.15;
                        applyDamage(target, caster, 80); createParticles(target.x, target.y, caster.colorDark, 40, 8);
                        addVisualEffect('vortex', caster.x, caster.y, caster.colorDark, 100);
                        break;
                    case 'nova':
                        applyDamage(target, caster, 150); createParticles(caster.x, caster.y, c, 60, 25, 2);
                        addVisualEffect('ring', caster.x, caster.y, c, 250); triggerScreenShake(true);
                        break;
                    case 'gatling':
                        for(let i=0; i<8; i++) setTimeout(() => shootProjectile(caster, target, 'bullet', (Math.random()-0.5)*0.5), i*80);
                        break;
                    case 'heal':
                        caster.hp = Math.min(caster.maxHp, caster.hp + 500);
                        createParticles(caster.x, caster.y, '#10b981', 30, 5, 2, 'cross');
                        break;
                    case 'blink':
                        createParticles(caster.x, caster.y, c, 20);
                        caster.x = target.x + (target.x > battleCanvas.width/2 ? -80 : 80);
                        caster.y = target.y + (target.y > battleCanvas.height/2 ? -80 : 80);
                        createParticles(caster.x, caster.y, c, 20);
                        break;
                    case 'mine':
                        projectiles.push({ x: caster.x, y: caster.y, vx: 0, vy: 0, radius: 12, color: baseC, damage: 300, owner: caster, type: 'mine', life: 300 });
                        break;
                    case 'tornado': shootProjectile(caster, target, 'tornado'); break;
                    case 'freeze':
                        target.frozen = 80; target.frozenBy = caster; target.vx = 0; target.vy = 0;
                        createParticles(target.x, target.y, '#bae6fd', 30, 5, 1.5, 'square');
                        break;
                    case 'gigant':
                        caster.gigant = 180; caster.radius = caster.baseRadius * 2.2;
                        createParticles(caster.x, caster.y, c, 40, 15); triggerScreenShake();
                        break;
                    case 'homing':
                        shootProjectile(caster, target, 'homing', -0.6); shootProjectile(caster, target, 'homing', 0); shootProjectile(caster, target, 'homing', 0.6);
                        break;
                    case 'earthquake':
                        applyDamage(target, caster, 150); target.vx *= 0.1; target.vy *= 0.1;
                        triggerScreenShake(true); createParticles(target.x, target.y + 20, caster.colorDark, 50, 12, 1.5, 'square');
                        break;
                    case 'shotgun':
                        for(let i=-3; i<=3; i++) shootProjectile(caster, target, 'bullet', i*0.25);
                        break;
                    case 'jump':
                        caster.vz = 20; // Z축 도약
                        createParticles(caster.x, caster.y, '#ffffff', 20, 5);
                        break;
                    case 'push':
                        if (dist < 250) {
                            const pAng = Math.atan2(target.y - caster.y, target.x - caster.x);
                            target.vx += Math.cos(pAng) * 45; target.vy += Math.sin(pAng) * 45;
                            applyDamage(target, caster, 120);
                            createDamageText(target.x, target.y, "-120", caster.colorLight, 20);
                            addVisualEffect('push_wave', caster.x, caster.y, caster.colorLight, 180, pAng);
                            triggerScreenShake();
                        }
                        break;
                    case 'wall': {
                        const angW = Math.atan2(target.y - caster.y, target.x - caster.x);
                        const wx = caster.x + Math.cos(angW) * 90, wy = caster.y + Math.sin(angW) * 90;
                        structures.push({ type: 'wall', x: wx, y: wy, radius: 34, hp: 300, maxHp: 300, owner: caster, life: 500, color: c });
                        createParticles(wx, wy, c, 20);
                        break;
                    }
                    case 'fly':
                        caster.z = 70; caster.vz = 0; caster.flying = 100;
                        createParticles(caster.x, caster.y, '#ffffff', 20);
                        break;
                    case 'stealth':
                        caster.stealth = 110;
                        createParticles(caster.x, caster.y, '#94a3b8', 20);
                        break;
                    case 'reflect':
                        caster.reflect = 150;
                        createParticles(caster.x, caster.y, c, 20);
                        break;
                    case 'slow':
                        target.slowed = 120; target.vx *= 0.3; target.vy *= 0.3;
                        createParticles(target.x, target.y, '#38bdf8', 20, 3, 1.5, 'square');
                        break;
                    case 'spin':
                        caster.spinOrbit = 24;
                        caster.spinAngle = Math.atan2(caster.y - target.y, caster.x - target.x);
                        createParticles(caster.x, caster.y, c, 40, 20, 1.5);
                        addVisualEffect('ring', target.x, target.y, c, 100); triggerScreenShake();
                        break;
                    case 'shockwave':
                        if (dist < 300) {
                            const swAng = Math.atan2(target.y - caster.y, target.x - caster.x);
                            target.vx += Math.cos(swAng) * 30; target.vy += Math.sin(swAng) * 30;
                            applyDamage(target, caster, 100);
                            createDamageText(target.x, target.y, "-100", caster.colorLight, 20);
                        }
                        addVisualEffect('ring', caster.x, caster.y, c, 320); triggerScreenShake(true);
                        break;
                    case 'totem':
                        structures.push({ type: 'totem', x: caster.x + (caster.isBlue ? 40 : -40), y: caster.y, hp: 250, owner: caster, timer: 60, life: 600, color: c });
                        createParticles(caster.x, caster.y, c, 15);
                        break;
                    case 'teleport':
                        createParticles(caster.x, caster.y, c, 25);
                        caster.x = Math.random() * (battleCanvas.width - 100) + 50;
                        caster.y = Math.random() * (battleCanvas.height - 100) + 50;
                        createParticles(caster.x, caster.y, c, 25);
                        break;
                    case 'beam': {
                        const angB = Math.atan2(target.y - caster.y, target.x - caster.x);
                        applyDamage(target, caster, 90);
                        createDamageText(target.x, target.y, "-90", c, 18);
                        addVisualEffect('beam', caster.x, caster.y, c, dist, angB);
                        triggerScreenShake();
                        break;
                    }
                }
            }
        }

        function clampFighterVelocity(f) {
            // 속도 이상 증폭(Infinity/NaN) 방지를 위한 절대 안전장치
            const speedSq = f.vx * f.vx + f.vy * f.vy;
            if (speedSq > 3600) { // max speed 60
                const speed = Math.sqrt(speedSq) || 0.1;
                f.vx = (f.vx / speed) * 60;
                f.vy = (f.vy / speed) * 60;
            }
            if (isNaN(f.x) || isNaN(f.y)) { f.x = battleCanvas.width/2; f.y = battleCanvas.height/2; f.vx=0; f.vy=0; }
        }

        function updateFighterAI(f, opponent, w, h) {
            // 사라짐 방지: 무조건 캔버스 중앙으로 복귀 조치
            if (f.x < -100 || f.x > w + 100 || f.y < -100 || f.y > h + 100 || isNaN(f.x)) {
                f.x = w / 2; f.y = h / 2; f.vx = 0; f.vy = 0; f.z = 0;
            }

            if (f.gigant > 0) { f.gigant--; if (f.gigant <= 0) f.radius = f.baseRadius; }
            if (f.stealth > 0) f.stealth--;
            if (f.reflect > 0) f.reflect--;
            if (f.slowed > 0) f.slowed--;
            if (f.frozen > 0) {
                f.frozen--;
                if (f.frozen <= 0) f.frozenBy = null;
                return;
            }

            if (f.spinOrbit > 0) {
                f.spinOrbit--;
                f.spinAngle += 0.75;
                const orbitRadius = f.radius + opponent.radius + 35;
                f.x = opponent.x + Math.cos(f.spinAngle) * orbitRadius;
                f.y = opponent.y + Math.sin(f.spinAngle) * orbitRadius;
                f.vx = 0; f.vy = 0;
                if (f.spinOrbit <= 0) {
                    const impactAngle = Math.atan2(opponent.y - f.y, opponent.x - f.x);
                    f.x = opponent.x - Math.cos(impactAngle) * (f.radius + opponent.radius - 2);
                    f.y = opponent.y - Math.sin(impactAngle) * (f.radius + opponent.radius - 2);
                    f.vx = Math.cos(impactAngle) * 20; f.vy = Math.sin(impactAngle) * 20;
                    applyDamage(opponent, f, 500);
                    createDamageText(opponent.x, opponent.y, "SPIN CRASH! -500", f.colorLight, 26);
                    createParticles(opponent.x, opponent.y, f.colorLight, 55, 18, 2);
                    addVisualEffect('ring', opponent.x, opponent.y, f.colorLight, 180);
                    triggerScreenShake(true);
                }
                return;
            }

            if (f.flying > 0) {
                f.flying--; f.z = 70; f.vz = 0; // 비행 중에는 고도를 유지
            } else if (f.z > 0 || f.vz > 0) {
                f.z += f.vz; f.vz -= 1.2; 
                if (f.z <= 0) {
                    f.z = 0; f.vz = 0; 
                    addVisualEffect('ring', f.x, f.y, f.color, 150);
                    triggerScreenShake(true);
                    const dist = Math.hypot(opponent.x - f.x, opponent.y - f.y) || 0.1;
                    if (dist < 180 && opponent.z === 0) {
                        const ang = Math.atan2(opponent.y - f.y, opponent.x - f.x);
                        opponent.vx += Math.cos(ang) * 35; opponent.vy += Math.sin(ang) * 35;
                        applyDamage(opponent, f, 250);
                        createDamageText(opponent.x, opponent.y, "SMASH! -250", f.color, 24);
                    }
                }
            }

            f.stateTimer--;
            const dx = opponent.x - f.x, dy = opponent.y - f.y;
            const dist = Math.hypot(dx, dy) || 0.1; // NaN 보정

            if (f.stateTimer <= 0) {
                f.stateTimer = Math.random() * 30 + 15; 
                const r = Math.random();
                if (dist < 120) {
                    if (r < 0.4) f.state = 'EVADE'; else if (r < 0.7) f.state = 'ATTACK'; else f.state = 'RETREAT';
                } else {
                    if (r < 0.6) f.state = 'CHASE'; else f.state = 'RANGED';
                }
            }

            const zPenalty = f.z > 0 ? 0.5 : 1.0;
            const slowPenalty = f.slowed > 0 ? 0.4 : 1.0; // 감속 상태에서는 가속 저하
            const speedAccel = (f.gigant > 0 ? 1.5 : 3.5) * zPenalty * slowPenalty; 
            const angle = Math.atan2(dy, dx);

            if (f.state === 'CHASE' || f.state === 'ATTACK') {
                f.vx += Math.cos(angle) * speedAccel; f.vy += Math.sin(angle) * speedAccel;
            } else if (f.state === 'RETREAT') {
                f.vx -= Math.cos(angle) * speedAccel; f.vy -= Math.sin(angle) * speedAccel;
            } else if (f.state === 'EVADE') {
                const evadeAngle = angle + (Math.PI / 2) * (Math.random() > 0.5 ? 1 : -1);
                f.vx += Math.cos(evadeAngle) * speedAccel * 1.5; f.vy += Math.sin(evadeAngle) * speedAccel * 1.5;
            }

            applySkill(f, opponent);

            if (f.z === 0) { 
                f.history.unshift({x: f.x, y: f.y}); if (f.history.length > 6) f.history.pop();
            }

            f.x += f.vx; f.y += f.vy;
            f.vx *= 0.88; f.vy *= 0.88; 

            clampFighterVelocity(f); // 에러 방지

            // 강력한 벽 반발력 (이탈 원천 차단)
            if (f.x < f.radius) { f.x = f.radius; f.vx = Math.abs(f.vx) * 0.8; }
            else if (f.x > w - f.radius) { f.x = w - f.radius; f.vx = -Math.abs(f.vx) * 0.8; }
            if (f.y < f.radius) { f.y = f.radius; f.vy = Math.abs(f.vy) * 0.8; }
            else if (f.y > h - f.radius) { f.y = h - f.radius; f.vy = -Math.abs(f.vy) * 0.8; }

            // 장벽 구조물과의 물리 충돌 (장벽 스킬)
            if (f.z === 0) {
                structures.forEach(st => {
                    if (st.type !== 'wall') return;
                    const wdx = f.x - st.x, wdy = f.y - st.y;
                    const wdist = Math.hypot(wdx, wdy) || 0.1;
                    const minDist = f.radius + st.radius;
                    if (wdist < minDist) {
                        const wAng = Math.atan2(wdy, wdx);
                        f.x = st.x + Math.cos(wAng) * minDist; f.y = st.y + Math.sin(wAng) * minDist;
                        f.vx *= -0.3; f.vy *= -0.3;
                    }
                });
            }
        }

        function checkFighterCollision(f1, f2) {
            if (f1.z > 0 || f2.z > 0) return;

            let dx = f2.x - f1.x, dy = f2.y - f1.y;
            let dist = Math.hypot(dx, dy);
            
            // 완벽히 겹쳤을 때의 NaN 에러 방지용 난수 배치
            if (dist === 0) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dist = 0.1; }
            
            const minDist = f1.radius + f2.radius;
            if (dist < minDist) {
                const angle = Math.atan2(dy, dx), overlap = minDist - dist;
                f1.x -= Math.cos(angle) * overlap * 0.5; f1.y -= Math.sin(angle) * overlap * 0.5;
                f2.x += Math.cos(angle) * overlap * 0.5; f2.y += Math.sin(angle) * overlap * 0.5;

                const speed1 = Math.hypot(f1.vx, f1.vy), speed2 = Math.hypot(f2.vx, f2.vy);
                const knockback = 5 + (speed1 + speed2) * 0.4;
                f1.vx -= Math.cos(angle) * knockback; f1.vy -= Math.sin(angle) * knockback;
                f2.vx += Math.cos(angle) * knockback; f2.vy += Math.sin(angle) * knockback;

                clampFighterVelocity(f1); clampFighterVelocity(f2); // 과도한 넉백 억제

                let dmg1 = Math.floor(speed2 * 5) + 15;
                let dmg2 = Math.floor(speed1 * 5) + 15;
                if(f1.gigant > 0) dmg2 *= 2; if(f2.gigant > 0) dmg1 *= 2; 

                if (!(f2.frozen > 0 && f2.frozenBy === f1)) applyDamage(f1, f2, dmg1);
                if (!(f1.frozen > 0 && f1.frozenBy === f2)) applyDamage(f2, f1, dmg2);
                if(dmg1 > 10 || dmg2 > 10) {
                    createParticles((f1.x + f2.x)/2, (f1.y + f2.y)/2, '#ffffff', 15);
                    triggerScreenShake((speed1+speed2)>25);
                }
            }
        }

        function updatePhysics(w, h) {
            updateFighterAI(fighter1, fighter2, w, h); 
            updateFighterAI(fighter2, fighter1, w, h);
            checkFighterCollision(fighter1, fighter2);

            for (let i = structures.length - 1; i >= 0; i--) {
                const st = structures[i];
                st.life--;
                if (st.type === 'totem') {
                    st.timer--;
                    if (st.timer <= 0) {
                        st.timer = 90;
                        const stTarget = st.owner === fighter1 ? fighter2 : fighter1;
                        if (stTarget.z === 0) {
                            const stAng = Math.atan2(stTarget.y - st.y, stTarget.x - st.x);
                            projectiles.push({
                                x: st.x, y: st.y, vx: Math.cos(stAng) * 18, vy: Math.sin(stAng) * 18,
                                radius: 5, color: st.color, damage: 45, owner: st.owner, type: 'bullet',
                                life: 100, penetrate: false, homing: false, maxSpeed: 18
                            });
                        }
                    }
                }
                if (st.life <= 0 || st.hp <= 0) structures.splice(i, 1);
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if(p.type === 'mine') {
                    p.life--;
                    if(p.life <= 0) { projectiles.splice(i,1); continue; }
                    let target = p.owner === fighter1 ? fighter2 : fighter1;
                    if(target.z === 0 && Math.hypot(target.x - p.x, target.y - p.y) < target.radius + 40) {
                        applyDamage(target, p.owner, p.damage);
                        createParticles(p.x, p.y, p.color, 40, 15, 2);
                        addVisualEffect('ring', p.x, p.y, p.color, 120);
                        triggerScreenShake(true);
                        projectiles.splice(i,1);
                    }
                    continue;
                }

                let blockedByWall = false;
                for (let w2 = structures.length - 1; w2 >= 0; w2--) {
                    const st = structures[w2];
                    if (st.type !== 'wall' || p.owner === st.owner) continue;
                    if (Math.hypot(p.x - st.x, p.y - st.y) < st.radius + (p.radius || 5)) {
                        st.hp -= p.damage;
                        createParticles(p.x, p.y, '#94a3b8', 10);
                        blockedByWall = true;
                        break;
                    }
                }
                if (blockedByWall) { projectiles.splice(i, 1); continue; }

                if (p.homing) {
                    let target = p.owner === fighter1 ? fighter2 : fighter1;
                    let pDx = target.x - p.x; let pDy = target.y - p.y;
                    let angle = (pDx === 0 && pDy === 0) ? 0 : Math.atan2(pDy, pDx);
                    p.vx += Math.cos(angle) * 1.5; p.vy += Math.sin(angle) * 1.5;
                    let spd = Math.hypot(p.vx, p.vy) || 0.1;
                    if(spd > p.maxSpeed) { p.vx = (p.vx/spd)*p.maxSpeed; p.vy = (p.vy/spd)*p.maxSpeed; }
                }
                p.x += p.vx; p.y += p.vy; p.life--;
                
                if (p.life <= 0 || p.x < -50 || p.x > w+50 || p.y < -50 || p.y > h+50) {
                    projectiles.splice(i, 1); continue;
                }

                let target = p.owner === fighter1 ? fighter2 : fighter1;
                if (target.z > 0 && p.type !== 'meteor') continue; 

                if (Math.hypot(target.x - p.x, target.y - p.y) < target.radius + p.radius) {
                    applyDamage(target, p.owner, p.damage);
                    createParticles(p.x, p.y, p.color, 20, 10);
                    if(p.type === 'meteor') { triggerScreenShake(true); addVisualEffect('ring', p.x, p.y, p.color, 150); }
                    if(!p.penetrate) projectiles.splice(i, 1);
                }
            }

            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let v = visualEffects[i];
                if (v.type === 'ring') {
                    v.radius += 8; v.alpha -= 0.04;
                    if (v.alpha <= 0) visualEffects.splice(i, 1);
                } else if (v.type === 'vortex') {
                    v.radius += 2; v.alpha -= 0.02;
                    if (v.alpha <= 0) visualEffects.splice(i, 1);
                } else if (v.type === 'push_wave') {
                    v.radius += 12; v.alpha -= 0.05;
                    if (v.alpha <= 0) visualEffects.splice(i, 1);
                } else if (v.type === 'beam') {
                    v.alpha -= 0.12;
                    if (v.alpha <= 0) visualEffects.splice(i, 1);
                }
            }

            for (let i = battleParticles.length - 1; i >= 0; i--) {
                let p = battleParticles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) battleParticles.splice(i, 1);
            }
        }

        function drawVisualEffects() {
            visualEffects.forEach(v => {
                if (v.type === 'ring') {
                    battleCtx.save(); battleCtx.globalAlpha = Math.max(0, v.alpha);
                    battleCtx.beginPath(); battleCtx.arc(v.x, v.y, v.radius, 0, Math.PI*2);
                    battleCtx.strokeStyle = v.color; battleCtx.lineWidth = 15 * v.alpha; battleCtx.stroke();
                    battleCtx.restore();
                } else if (v.type === 'vortex') {
                    battleCtx.save(); battleCtx.globalAlpha = Math.max(0, v.alpha);
                    battleCtx.beginPath(); battleCtx.arc(v.x, v.y, Math.max(0, v.maxRadius - v.radius), 0, Math.PI*2);
                    battleCtx.strokeStyle = v.color; battleCtx.lineWidth = 5; battleCtx.stroke();
                    battleCtx.restore();
                } else if (v.type === 'push_wave') {
                    battleCtx.save(); battleCtx.globalAlpha = Math.max(0, v.alpha);
                    battleCtx.beginPath(); battleCtx.arc(v.x, v.y, v.radius, v.angle - 0.5, v.angle + 0.5);
                    battleCtx.strokeStyle = v.color; battleCtx.lineWidth = 20 * v.alpha; battleCtx.stroke();
                    battleCtx.restore();
                } else if (v.type === 'beam') {
                    battleCtx.save(); battleCtx.globalAlpha = Math.max(0, v.alpha);
                    battleCtx.beginPath(); battleCtx.moveTo(v.x, v.y);
                    battleCtx.lineTo(v.x + Math.cos(v.angle) * v.maxRadius, v.y + Math.sin(v.angle) * v.maxRadius);
                    battleCtx.strokeStyle = v.color; battleCtx.lineWidth = 6; battleCtx.stroke();
                    battleCtx.restore();
                }
            });
        }

        function drawStructures() {
            structures.forEach(st => {
                if (st.type === 'wall') {
                    battleCtx.save(); battleCtx.globalAlpha = Math.max(0.2, st.hp / st.maxHp);
                    battleCtx.beginPath(); battleCtx.arc(st.x, st.y, st.radius, 0, Math.PI * 2);
                    battleCtx.fillStyle = 'rgba(148,163,184,0.35)'; battleCtx.fill();
                    battleCtx.lineWidth = 3; battleCtx.strokeStyle = st.color || '#94a3b8'; battleCtx.stroke();
                    battleCtx.restore();
                } else if (st.type === 'totem') {
                    battleCtx.save();
                    battleCtx.beginPath(); battleCtx.arc(st.x, st.y, 14, 0, Math.PI * 2);
                    battleCtx.fillStyle = st.color; battleCtx.fill();
                    battleCtx.lineWidth = 2; battleCtx.strokeStyle = '#ffffff'; battleCtx.stroke();
                    battleCtx.restore();
                }
            });
        }

        function drawFighter(f) {
            if (f.z > 0) {
                battleCtx.fillStyle = 'rgba(0,0,0,0.4)';
                battleCtx.beginPath(); 
                battleCtx.ellipse(f.x, f.y, f.baseRadius * 0.8, f.baseRadius * 0.4, 0, 0, Math.PI * 2); 
                battleCtx.fill();
            }

            const drawY = f.y - f.z;
            const drawRadius = f.radius * (1 + f.z * 0.005); 

            if (f.history.length > 1 && f.z === 0) {
                battleCtx.lineCap = 'round'; battleCtx.lineJoin = 'round';
                battleCtx.beginPath(); battleCtx.moveTo(f.history[0].x, f.history[0].y);
                for (let i = 1; i < f.history.length; i++) battleCtx.lineTo(f.history[i].x, f.history[i].y);
                battleCtx.strokeStyle = f.color; battleCtx.lineWidth = drawRadius; battleCtx.globalAlpha = 0.3; battleCtx.stroke(); battleCtx.globalAlpha = 1.0;
            }

            if (f.shield > 0) {
                battleCtx.beginPath(); 
                battleCtx.setLineDash([10, 10]);
                battleCtx.arc(f.x, drawY, drawRadius + 8, (Date.now()/150)%Math.PI*2, (Date.now()/150)%Math.PI*2 + Math.PI * 2);
                battleCtx.strokeStyle = f.colorLight; battleCtx.lineWidth = 4; battleCtx.stroke();
                battleCtx.setLineDash([]);
            }

            if (f.reflect > 0) {
                battleCtx.beginPath();
                battleCtx.setLineDash([4, 6]);
                battleCtx.arc(f.x, drawY, drawRadius + 14, 0, Math.PI * 2);
                battleCtx.strokeStyle = '#facc15'; battleCtx.lineWidth = 3; battleCtx.stroke();
                battleCtx.setLineDash([]);
            }

            const stealthAlpha = f.stealth > 0 ? 0.35 : 1.0;
            battleCtx.save(); battleCtx.globalAlpha = stealthAlpha;

            if (f.frozen > 0) battleCtx.fillStyle = '#bae6fd';
            else battleCtx.fillStyle = f.color;

            battleCtx.beginPath(); battleCtx.arc(f.x, drawY, drawRadius, 0, Math.PI * 2);
            battleCtx.fill(); battleCtx.lineWidth = 2; battleCtx.strokeStyle = '#ffffff'; battleCtx.stroke();
            battleCtx.restore();

            battleCtx.fillStyle = '#ffffff'; battleCtx.textAlign = 'center'; battleCtx.textBaseline = 'top'; battleCtx.font = `bold 12px Pretendard`;
            const textWidth = battleCtx.measureText(f.name).width;
            battleCtx.fillStyle = 'rgba(0,0,0,0.6)'; battleCtx.fillRect(f.x - textWidth/2 - 4, drawY + drawRadius + 2, textWidth + 8, 16);
            battleCtx.fillStyle = '#ffffff'; battleCtx.fillText(f.name, f.x, drawY + drawRadius + 4);
        }

        function runBattleLoop() {
            const w = battleCanvas.width, h = battleCanvas.height;
            battleFrameCount++;
            
            if (!battlePaused) {
                if (battleSpeed === 0.5) {
                    if (battleFrameCount % 2 === 0) updatePhysics(w, h);
                } else {
                    for (let s = 0; s < battleSpeed; s++) {
                        updatePhysics(w, h);
                        if (fighter1.hp <= 0 || fighter2.hp <= 0) break;
                    }
                }
            }

            battleCtx.clearRect(0, 0, w, h);

            // 동적 카메라: 두 전투원의 중앙으로 부드럽게 이동하며 줌 조절
            const midX = (fighter1.x + fighter2.x) / 2;
            const midY = (fighter1.y + fighter2.y) / 2;
            let targetX = w / 2, targetY = h / 2, targetZoom = 1;
            if (isDynamicCamera) {
                const fighterDist = Math.hypot(fighter1.x - fighter2.x, fighter1.y - fighter2.y);
                const padding = 220;
                targetZoom = Math.min(w / (fighterDist + padding), h / (fighterDist + padding), 1.4);
                targetZoom = Math.max(targetZoom, 0.55);
                targetX = midX; targetY = midY;
            }
            camera.x += (targetX - camera.x) * 0.06;
            camera.y += (targetY - camera.y) * 0.06;
            camera.zoom += (targetZoom - camera.zoom) * 0.06;

            battleCtx.save();
            battleCtx.translate(w / 2, h / 2);
            battleCtx.scale(camera.zoom, camera.zoom);
            battleCtx.translate(-camera.x, -camera.y);

            drawVisualEffects();
            drawStructures();

            projectiles.forEach(p => {
                const radius = Math.max(0.1, p.radius);
                const speed = Math.hypot(p.vx, p.vy) || 1;
                const tailLength = Math.min(80, speed * (p.type === 'meteor' ? 3 : 2));
                const tailX = p.x - (p.vx / speed) * tailLength, tailY = p.y - (p.vy / speed) * tailLength;
                const trail = battleCtx.createLinearGradient(tailX, tailY, p.x, p.y);
                trail.addColorStop(0, 'rgba(255,255,255,0)');
                trail.addColorStop(0.65, `${p.color}55`);
                trail.addColorStop(1, p.color);
                battleCtx.save();
                battleCtx.globalCompositeOperation = 'lighter';
                battleCtx.strokeStyle = trail;
                battleCtx.lineWidth = Math.max(2, radius * 1.3);
                battleCtx.lineCap = 'round';
                battleCtx.beginPath(); battleCtx.moveTo(tailX, tailY); battleCtx.lineTo(p.x, p.y); battleCtx.stroke();
                battleCtx.shadowColor = p.color; battleCtx.shadowBlur = radius * 2.5;

                if (p.type === 'tornado') {
                    battleCtx.strokeStyle = p.color; battleCtx.lineWidth = 3;
                    for (let ring = 0; ring < 3; ring++) {
                        battleCtx.beginPath();
                        battleCtx.ellipse(p.x, p.y + (ring - 1) * 9, radius * (1 - ring * 0.16), 5, 0, Math.PI * 2);
                        battleCtx.stroke();
                    }
                } else if (p.type === 'meteor') {
                    const meteor = battleCtx.createRadialGradient(p.x - radius * 0.3, p.y - radius * 0.3, 2, p.x, p.y, radius);
                    meteor.addColorStop(0, '#fff7ed'); meteor.addColorStop(0.35, '#fbbf24'); meteor.addColorStop(1, p.color);
                    battleCtx.fillStyle = meteor;
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, radius, 0, Math.PI * 2); battleCtx.fill();
                } else if (p.type === 'mine') {
                    battleCtx.fillStyle = p.color;
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, radius, 0, Math.PI * 2); battleCtx.fill();
                    battleCtx.strokeStyle = '#ffffff'; battleCtx.lineWidth = 2; battleCtx.stroke();
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, radius + 5, 0, Math.PI * 2);
                    battleCtx.strokeStyle = `${p.color}88`; battleCtx.stroke();
                } else {
                    const orb = battleCtx.createRadialGradient(p.x - radius * 0.35, p.y - radius * 0.35, 1, p.x, p.y, radius);
                    orb.addColorStop(0, '#ffffff'); orb.addColorStop(0.3, p.color); orb.addColorStop(1, `${p.color}66`);
                    battleCtx.fillStyle = orb;
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, radius, 0, Math.PI * 2); battleCtx.fill();
                }
                battleCtx.restore();
            });

            battleParticles.forEach(p => {
                battleCtx.save(); battleCtx.globalAlpha = Math.max(0, p.alpha); battleCtx.fillStyle = p.color;
                if(p.shape === 'cross') {
                    battleCtx.fillRect(p.x - p.size/2, p.y - p.size/6, p.size, p.size/3);
                    battleCtx.fillRect(p.x - p.size/6, p.y - p.size/2, p.size/3, p.size);
                } else if (p.shape === 'square') {
                    battleCtx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, Math.max(0.1, p.size), 0, Math.PI * 2); battleCtx.fill(); 
                }
                battleCtx.restore();
            });

            drawFighter(fighter1); drawFighter(fighter2);
            battleCtx.restore();
            updateHpUI();

            if (fighter1.hp <= 0 || fighter2.hp <= 0) {
                cancelAnimationFrame(battleAnimationFrame);
                const winner = fighter1.hp > fighter2.hp ? fighter1 : fighter2;
                setTimeout(() => {
                    battleResultOverlay.classList.remove('hidden'); battleResultOverlay.classList.add('flex', 'pop-in');
                    battleWinnerText.textContent = `${winner.name} 승리!`; battleWinnerText.style.color = winner.colorLight;
                    triggerCustomConfetti();
                }, 500);
                return;
            }
            battleAnimationFrame = requestAnimationFrame(runBattleLoop);
        }

        function forceExitBattle() {
            if (battleAnimationFrame) cancelAnimationFrame(battleAnimationFrame);
            battleArenaView.classList.add('hidden'); mainRouletteView.classList.remove('hidden');
            selectedFighters = [];
            camera = { x: 0, y: 0, zoom: 1 }; // 카메라 상태 초기화
            if (isBattleMode) {
                battleStatusText.textContent = "1차 선발: 블루 코너 추첨 중..."; spinBtnText.textContent = "블루 코너(1차) 추첨하기";
            } else spinBtnText.textContent = "추첨 시작!";
            setControlsDisabled(false);
            // 전투 중 숨겨져 있던 룰렛 캔버스가 잘못된 크기로 남아있을 수 있으므로 다시 계산
            resizeCanvas();
        }

        document.getElementById('exitBattleEarlyBtn').addEventListener('click', forceExitBattle);
        document.getElementById('returnFromBattleBtn').addEventListener('click', forceExitBattle);
        
        document.getElementById('rematchBattleBtn').addEventListener('click', () => {
            if (currentBlueUniv && currentRedUniv) {
                start2DBattle(currentBlueUniv, currentRedUniv, fighter1.skills, fighter2.skills);
            }
        });

        battleToggle.addEventListener('change', (e) => {
            isBattleMode = e.target.checked; selectedFighters = [];
            saveBattleMode(); 
            if (isBattleMode) {
                battleStatusBanner.classList.remove('hidden');
                battleStatusText.textContent = "1차 선발: 블루 코너 추첨 중..."; spinBtnText.textContent = "블루 코너(1차) 추첨하기";
            } else {
                battleStatusBanner.classList.add('hidden'); spinBtnText.textContent = "추첨 시작!";
            }
        });

        dynamicCameraToggle.addEventListener('change', (e) => {
            isDynamicCamera = e.target.checked;
            saveDynamicCamera();
        });

        function renderSidebar() {
            listContainer.innerHTML = '';
            const filteredUniversities = universities.filter(u => u.name.toLowerCase().includes(searchQuery.toLowerCase()));
            countDisplay.textContent = `총 ${universities.filter(u => u.active).length}개 선택됨`;

            filteredUniversities.forEach(u => {
                const label = document.createElement('label');
                label.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer bg-white border border-slate-200 transition-all ${u.active ? 'shadow-sm border-slate-300' : 'opacity-40 hover:opacity-100'}`;
                label.innerHTML = `<div class="relative flex items-center"><input type="checkbox" class="sr-only peer" ${u.active ? 'checked' : ''} data-id="${u.id}"><div class="w-5 h-5 rounded border-2 border-slate-300 peer-checked:bg-slate-900 peer-checked:border-slate-900 transition-colors flex items-center justify-center"><svg class="w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg></div></div>`;
                const span = document.createElement('span'); span.className = `text-sm font-semibold ${u.active ? 'text-slate-900' : 'text-slate-500'}`; span.textContent = u.name; label.appendChild(span);
                label.querySelector('input').addEventListener('change', (e) => {
                    if (isSpinning || isDragging) return;
                    universities.find(item => item.id === u.id).active = e.target.checked; 
                    saveData(); 
                    renderSidebar(); drawWheel();
                });
                listContainer.appendChild(label);
            });
        }
        function openSidebar() { if (isSpinning || isDragging) return; sidebarOverlay.classList.remove('hidden'); setTimeout(() => { sidebarOverlay.classList.remove('opacity-0'); sidebarOverlay.classList.add('opacity-100'); }, 10); sidebar.classList.remove('-translate-x-full'); }
        function closeSidebar() { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.remove('opacity-100'); sidebarOverlay.classList.add('opacity-0'); setTimeout(() => sidebarOverlay.classList.add('hidden'), 300); }
        
        window.addEventListener('resize', resizeCanvas); spinBtn.addEventListener('click', startSpin);
        menuBtn.addEventListener('click', openSidebar); document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar); sidebarOverlay.addEventListener('click', closeSidebar);
        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; renderSidebar(); });
        
        document.getElementById('selectAllBtn').addEventListener('click', () => { 
            if (isSpinning || isDragging) return; universities.forEach(u => u.active = true); saveData(); renderSidebar(); drawWheel(); 
        });
        document.getElementById('deselectAllBtn').addEventListener('click', () => { 
            if (isSpinning || isDragging) return; universities.forEach(u => u.active = false); saveData(); renderSidebar(); drawWheel(); 
        });
        document.getElementById('shuffleBtn').addEventListener('click', () => { 
            if (isSpinning || isDragging) return; universities = shuffleArray(universities); renderSidebar(); drawWheel(); 
        });
        
        renderSidebar(); resizeCanvas();

    </script>
</body>
</html>
