<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대학 룰렛</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            min-h-screen;
        }

        /* 룰렛 메인 컨테이너 */
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            touch-action: none;
            cursor: grab;
        }

        .wheel-container:active {
            cursor: grabbing;
        }

        canvas#rouletteCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            display: block;
        }

        /* 상단 핀 (포인터) */
        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 40px;
            background-color: #0f172a;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2));
        }

        /* 중앙 핀 */
        .center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            border: 5px solid #0f172a;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
        }

        /* 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .btn-spin:active { transform: scale(0.97); }

        /* 심플 모달 팝업 애니메이션 */
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 폭죽 전용 오버레이 캔버스 */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 60;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 relative">

    <!-- 폭죽 전용 캔버스 (이상한 큰 원 버그 방지) -->
    <canvas id="confettiCanvas"></canvas>

    <!-- 상단 헤더 (항상 보이도록 sticky 지정) -->
    <header class="sticky top-0 w-full h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-30 shrink-0 shadow-sm">
        <button id="menuBtn" class="p-2 -ml-2 rounded-lg hover:bg-slate-100 text-slate-700 transition-colors focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <span class="text-xs font-bold text-slate-600">대학 목록 설정</span>
        </button>
        <h1 class="text-lg font-extrabold tracking-tight text-slate-900">University Roulette</h1>
        <div class="w-10"></div>
    </header>

    <!-- 메인 룰렛 영역 -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative z-0 my-auto">
        <div class="w-full max-w-lg mx-auto flex flex-col items-center py-4">
            
            <div class="wheel-container mb-6" id="wheelContainer">
                <div class="pointer"></div>
                <div class="center-pin"></div>
                <canvas id="rouletteCanvas"></canvas>
            </div>

            <button id="spinBtn" class="btn-spin w-full max-w-md py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-bold text-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-xl shadow-slate-900/10">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                추첨 시작!
            </button>
            <p class="text-center text-slate-400 mt-3 text-xs font-medium">💡 룰렛을 직접 손으로 돌려볼 수도 있습니다.</p>
        </div>
    </main>

    <!-- 사이드바 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>

    <!-- 사이드바 (대학 편집 메뉴) -->
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-[320px] max-w-[85vw] bg-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl border-r border-slate-200">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white">
            <div>
                <h2 class="text-lg font-bold text-slate-900">대학 목록 편집</h2>
                <p class="text-xs font-semibold text-slate-500 mt-0.5" id="countDisplay">총 0개 선택됨</p>
            </div>
            <button id="closeSidebarBtn" class="p-2 -mr-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors focus:outline-none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <div class="p-3 border-b border-slate-100 bg-slate-50 shrink-0">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="대학 이름 검색..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition-shadow">
            </div>
        </div>

        <div class="px-3 py-2 flex gap-2 border-b border-slate-100 shrink-0 bg-white">
            <button id="selectAllBtn" class="flex-1 text-xs font-semibold py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">전체 선택</button>
            <button id="deselectAllBtn" class="flex-1 text-xs font-semibold py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">전체 해제</button>
            <button id="shuffleBtn" class="text-xs font-semibold px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg transition-colors">순서 섞기</button>
        </div>

        <div id="universityList" class="flex-1 overflow-y-auto p-3 custom-scrollbar flex flex-col gap-1.5 bg-slate-50">
            <!-- 대학 목록 주입 -->
        </div>
    </aside>

    <!-- 심플 네모 팝업 모달 -->
    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modalContent" class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl relative z-10 border border-slate-100 hidden">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">당첨 결과</p>
            <h2 id="winnerName" class="text-2xl font-extrabold text-slate-900 tracking-tight leading-tight my-5">
                <!-- 결과 대학교 명칭 -->
            </h2>
            
            <button id="closeModalBtn" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-base transition-colors shadow-md">
                확인
            </button>
        </div>
    </div>

    <script>
        // 한국 주요 대학교 정식 명칭 (약 90여 개)
        const rawUniversities = [
            '서울대학교', '연세대학교', '고려대학교', '서강대학교', '성균관대학교', '한양대학교', 
            '중앙대학교', '경희대학교', '한국외국어대학교', '서울시립대학교', '이화여자대학교', '건국대학교', 
            '동국대학교', '홍익대학교', '국민대학교', '숭실대학교', '세종대학교', '단국대학교', 
            '광운대학교', '명지대학교', '상명대학교', '가톨릭대학교', '숙명여자대학교', '성신여자대학교', 
            '동덕여자대학교', '덕성여자대학교', '서울여자대학교', '한성대학교', '서경대학교', '삼육대학교',
            'KAIST', 'POSTECH', 'UNIST', 'DGIST', 'GIST', '한국에너지공과대학교',
            '인하대학교', '아주대학교', '가천대학교', '경기대학교', '인천대학교', '한국항공대학교', 
            '강남대학교', '수원대학교', '안양대학교', '차의과학대학교', '한세대학교', '성결대학교',
            '협성대학교', '평택대학교', '한양대(ERICA)', '충남대학교', '충북대학교', '공주대학교', 
            '순천향대학교', '한국기술교육대학교', '한밭대학교', '목원대학교', '배재대학교', '우송대학교', 
            '대전대학교', '청주대학교', '선문대학교', '호서대학교', '남서울대학교', '부산대학교', 
            '경북대학교', '부경대학교', '동아대학교', '울산대학교', '영남대학교', '계명대학교', 
            '대구대학교', '창원대학교', '동의대학교', '경성대학교', '인제대학교', '대구가톨릭대학교', 
            '금오공과대학교', '한동대학교', '경남대학교', '동서대학교', '신라대학교', '경상국립대학교',
            '전남대학교', '전북대학교', '조선대학교', '원광대학교', '목포대학교', '군산대학교', 
            '순천대학교', '우석대학교', '호남대학교', '광주대학교', '강원대학교', '제주대학교', 
            '연세대(미래)', '한림대학교', '상지대학교', '가톨릭관동대학교', '한라대학교'
        ];

        // 배열 무작위 셔플 함수
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 대학 목록을 무작위로 섞어서 초기화
        let universities = shuffleArray(rawUniversities).map((name, index) => ({
            id: index,
            name: name,
            active: true
        }));

        // 파스텔 계열 슬레이트 색상
        const colors = ['#f8fafc', '#f1f5f9', '#e2e8f0']; 

        // 룰렛 상태 변수
        let searchQuery = '';
        let currentAngle = 0; 
        let angularVelocity = 0;
        let isSpinning = false;
        let isDragging = false;
        let startTouchAngle = 0;
        let lastTouchAngle = 0;
        let animationFrameId = null;
        
        // DOM 요소
        const listContainer = document.getElementById('universityList');
        const countDisplay = document.getElementById('countDisplay');
        const spinBtn = document.getElementById('spinBtn');
        const menuBtn = document.getElementById('menuBtn');
        const modal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const searchInput = document.getElementById('searchInput');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const wheelContainer = document.getElementById('wheelContainer');
        
        // Canvas 설정
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const size = canvas.parentElement.clientWidth;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);
            drawWheel();
        }

        // 룰렛 화면 그리기
        function drawWheel(angleOffset = currentAngle) {
            const activeItems = universities.filter(u => u.active);
            const size = canvas.clientWidth;
            const cx = size / 2;
            const cy = size / 2;
            const radius = size / 2;

            ctx.clearRect(0, 0, size, size);

            if (activeItems.length === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = "#e2e8f0";
                ctx.fill();
                ctx.fillStyle = "#64748b";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = "bold 18px Pretendard";
                ctx.fillText("선택된 대학이 없습니다", cx, cy);
                return;
            }

            const sliceAngle = (2 * Math.PI) / activeItems.length;

            for (let i = 0; i < activeItems.length; i++) {
                const startAngle = angleOffset + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // 조각
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // 글자
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                let fontSize = Math.max(8, Math.min(20, (2 * Math.PI * radius / activeItems.length) * 0.6));
                ctx.font = `bold ${fontSize}px Pretendard`;
                ctx.fillStyle = (i % 2 === 0) ? "#0f172a" : "#475569";
                
                ctx.fillText(activeItems[i].name, radius * 0.94, 0, radius * 0.45);
                ctx.restore();
            }
        }

        // --- 회전 도중 버튼 및 입력 요소 잠금/해제 ---
        function setControlsDisabled(disabled) {
            spinBtn.disabled = disabled;
            menuBtn.disabled = disabled;
            
            const inputs = sidebar.querySelectorAll('input, button');
            inputs.forEach(el => el.disabled = disabled);
        }

        // --- 터치/드래그 물리 조작 ---
        function getEventAngle(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - cy, clientX - cx);
        }

        function onDragStart(e) {
            if (isSpinning) return;
            isDragging = true;
            setControlsDisabled(true);
            startTouchAngle = getEventAngle(e);
            lastTouchAngle = startTouchAngle;
            angularVelocity = 0;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function onDragMove(e) {
            if (!isDragging) return;
            const angle = getEventAngle(e);
            let diff = angle - lastTouchAngle;
            
            if (diff > Math.PI) diff -= 2 * Math.PI;
            if (diff < -Math.PI) diff += 2 * Math.PI;

            currentAngle += diff;
            angularVelocity = diff; 
            lastTouchAngle = angle;
            drawWheel();
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            if (Math.abs(angularVelocity) > 0.01) {
                applyInertia();
            } else {
                setControlsDisabled(false);
            }
        }

        function applyInertia() {
            if (isDragging) return;
            currentAngle += angularVelocity;
            angularVelocity *= 0.95;

            drawWheel();

            if (Math.abs(angularVelocity) > 0.001) {
                animationFrameId = requestAnimationFrame(applyInertia);
            } else {
                setControlsDisabled(false);
            }
        }

        wheelContainer.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);

        wheelContainer.addEventListener('touchstart', onDragStart, { passive: true });
        window.addEventListener('touchmove', onDragMove, { passive: true });
        window.addEventListener('touchend', onDragEnd);

        // --- 자동 추첨 ---
        function easeOutQuart(t) {
            return 1 - Math.pow(1 - t, 5);
        }

        function startSpin() {
            if (isSpinning || isDragging) return;
            const activeItems = universities.filter(u => u.active);
            if (activeItems.length === 0) {
                alert("대학을 1개 이상 선택해주세요.");
                openSidebar();
                return;
            }

            isSpinning = true;
            setControlsDisabled(true);

            const baseSpins = 10 + Math.random() * 4; 
            const randomRotation = baseSpins * 2 * Math.PI + Math.random() * (2 * Math.PI);
            
            const startAngle = currentAngle;
            const targetRotation = startAngle + randomRotation;
            const duration = 5500;
            const startTime = performance.now();

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                let progress = elapsed / duration;
                
                if (progress >= 1) progress = 1;

                const easedProgress = easeOutQuart(progress);
                currentAngle = startAngle + (targetRotation - startAngle) * easedProgress;
                
                drawWheel(currentAngle);

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    determineWinnerAndShowModal();
                }
            }

            animationFrameId = requestAnimationFrame(animateSpin);
        }

        // 12시 방향 바늘 기준 당첨자 산출
        function determineWinnerAndShowModal() {
            const activeItems = universities.filter(u => u.active);
            const sliceAngle = (2 * Math.PI) / activeItems.length;
            
            let normalizedAngle = currentAngle % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            let offset = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
            if (offset < 0) offset += 2 * Math.PI;

            const winnerIndex = Math.floor(offset / sliceAngle);
            const winner = activeItems[winnerIndex];

            showModal(winner);
        }

        // --- 경량화 자체 폭죽 엔진 (버그 방지) ---
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        function triggerCustomConfetti() {
            confettiParticles = [];
            const colors = ['#0f172a', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'];
            
            for (let i = 0; i < 70; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2 + 50,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.008
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;

            confettiParticles.forEach(p => {
                if (p.alpha > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3; // 중력
                    p.alpha -= p.decay;

                    confettiCtx.save();
                    confettiCtx.globalAlpha = Math.max(0, p.alpha);
                    confettiCtx.fillStyle = p.color;
                    confettiCtx.fillRect(p.x, p.y, p.size, p.size);
                    confettiCtx.restore();
                }
            });

            if (active) {
                requestAnimationFrame(animateConfetti);
            } else {
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        // 모달창 열기
        function showModal(winner) {
            document.getElementById('winnerName').textContent = winner.name;

            modal.classList.remove('hidden');
            modalContent.classList.remove('hidden');
            modalContent.classList.add('pop-in');
            
            triggerCustomConfetti();
        }

        // 모달창 닫기
        function closeModal() {
            modalContent.classList.remove('pop-in');
            modal.classList.add('hidden');
            setControlsDisabled(false);
        }

        // 사이드바 목록 렌더링
        function renderSidebar() {
            listContainer.innerHTML = '';
            
            const filteredUniversities = universities.filter(u => 
                u.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const activeCount = universities.filter(u => u.active).length;
            countDisplay.textContent = `총 ${activeCount}개 선택됨`;

            filteredUniversities.forEach(u => {
                const label = document.createElement('label');
                label.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer bg-white border border-slate-200 transition-all ${u.active ? 'shadow-sm border-slate-300' : 'opacity-40 hover:opacity-100'}`;
                
                label.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" class="sr-only peer" ${u.active ? 'checked' : ''} data-id="${u.id}">
                        <div class="w-5 h-5 rounded border-2 border-slate-300 peer-checked:bg-slate-900 peer-checked:border-slate-900 transition-colors flex items-center justify-center">
                            <svg class="w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                        </div>
                    </div>
                `;
                
                const span = document.createElement('span');
                span.className = `text-sm font-semibold ${u.active ? 'text-slate-900' : 'text-slate-500'}`;
                span.textContent = u.name;

                label.appendChild(span);

                const checkbox = label.querySelector('input');
                checkbox.addEventListener('change', (e) => {
                    if (isSpinning || isDragging) return;
                    universities.find(item => item.id === u.id).active = e.target.checked;
                    renderSidebar();
                    drawWheel();
                });

                listContainer.appendChild(label);
            });
        }

        // 사이드바 제어
        function openSidebar() {
            if (isSpinning || isDragging) return;
            sidebarOverlay.classList.remove('hidden');
            setTimeout(() => {
                sidebarOverlay.classList.remove('opacity-0');
                sidebarOverlay.classList.add('opacity-100');
            }, 10);
            sidebar.classList.remove('-translate-x-full');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('opacity-0');
            setTimeout(() => {
                sidebarOverlay.classList.add('hidden');
            }, 300);
        }

        // 이벤트 리스너
        window.addEventListener('resize', resizeCanvas);
        spinBtn.addEventListener('click', startSpin);
        
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        menuBtn.addEventListener('click', openSidebar);
        document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderSidebar();
        });

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            if (isSpinning || isDragging) return;
            universities.forEach(u => u.active = true);
            renderSidebar();
            drawWheel();
        });

        document.getElementById('deselectAllBtn').addEventListener('click', () => {
            if (isSpinning || isDragging) return;
            universities.forEach(u => u.active = false);
            renderSidebar();
            drawWheel();
        });

        document.getElementById('shuffleBtn').addEventListener('click', () => {
            if (isSpinning || isDragging) return;
            universities = shuffleArray(universities);
            renderSidebar();
            drawWheel();
        });

        // 초기화
        renderSidebar();
        resizeCanvas();

    </script>
</body>
</html>
